name: microvm-isolation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microvm-real-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apt install qemu and busybox
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 busybox-static wget

      - name: Inspect qemu data dir
        run: |
          set -x
          ls -l /usr/share/qemu || true
          echo "::error title=diag::share_qemu=$(ls /usr/share/qemu 2>&1 | tr '\n' ',')"
          echo "::error title=diag::module_dir=$(ls -d /usr/lib/x86_64-linux-gnu/qemu 2>&1)"
          echo "::error title=diag::bios_microvm=$(test -f /usr/share/qemu/bios-microvm.bin && echo present || echo missing)"
          echo "::error title=diag::bios_256k=$(test -f /usr/share/qemu/bios-256k.bin && echo present || echo missing)"
          echo "::error title=diag::qemu_version=$(qemu-system-x86_64 --version | head -n1)"
          test -f /usr/share/qemu/bios-microvm.bin
