name: microvm-isolation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microvm-real-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU and static busybox
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 busybox-static wget curl

      - name: Assemble microvm assets
        run: |
          set -eux
          mkdir -p /opt/cgt-microvm/bin /opt/cgt-microvm/kernel \
                   /opt/cgt-microvm/root/usr/lib/x86_64-linux-gnu \
                   /opt/cgt-microvm/root/usr/share
          cp "$(command -v qemu-system-x86_64)" /opt/cgt-microvm/bin/
          cp "$(command -v busybox)" /opt/cgt-microvm/bin/busybox
          chmod +x /opt/cgt-microvm/bin/qemu-system-x86_64 /opt/cgt-microvm/bin/busybox
          ln -sfn /usr/share/qemu /opt/cgt-microvm/root/usr/share/qemu
          ln -sfn /usr/lib/x86_64-linux-gnu/qemu /opt/cgt-microvm/root/usr/lib/x86_64-linux-gnu/qemu
          ln -sfn /usr/lib /opt/cgt-microvm/root/lib
          wget -q -O /opt/cgt-microvm/kernel/vmlinuz-virt \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/netboot/vmlinuz-virt
          # Ubuntu's qemu-system-x86 no longer ships bios-microvm.bin; take the
          # upstream blob matching the runner's QEMU 10.2 line.
          sudo curl -fsSL \
            "https://raw.githubusercontent.com/qemu/qemu/v10.2.0/pc-bios/bios-microvm.bin" \
            -o /usr/share/qemu/bios-microvm.bin
          test -s /opt/cgt-microvm/kernel/vmlinuz-virt
          test -s /usr/share/qemu/bios-microvm.bin
          /opt/cgt-microvm/bin/qemu-system-x86_64 --version

      - name: Run real MicroVM isolation assertions
        env:
          CGT_MICROVM_HOME: /opt/cgt-microvm
          CGT_MICROVM_ACCEL: tcg
        run: |
          set +e
          python3 microvm/verify_microvm.py > /tmp/verify.log 2>&1
          status=$?
          echo "exit=$status"
          cat /tmp/verify.log
          if [ "$status" -ne 0 ]; then
            echo "::error title=verifier::$(tail -n 10 /tmp/verify.log | tr '\n' '|')"
          fi
          exit $status

      - name: Runner facts
        if: always()
        run: |
          echo "runner_kernel=$(uname -r)"
          test -r /dev/kvm && echo "host_kvm=readable" || echo "host_kvm=not-readable (TCG path)"
          ls -l /opt/cgt-microvm/bin /opt/cgt-microvm/kernel /usr/share/qemu/bios-microvm.bin || true
